name: Build A.Y Legend Client APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter Android project
        run: |
          flutter create --platforms=android --org com.aylegend --project-name ay_legend_client /tmp/ay_legend_client
          cp pubspec.yaml /tmp/ay_legend_client/pubspec.yaml
          rm -rf /tmp/ay_legend_client/lib
          cp -R lib /tmp/ay_legend_client/lib
          if [ -d assets ]; then
            rm -rf /tmp/ay_legend_client/assets
            cp -R assets /tmp/ay_legend_client/assets
          fi

      - name: Get dependencies
        working-directory: /tmp/ay_legend_client
        run: flutter pub get

      - name: Analyze project
        working-directory: /tmp/ay_legend_client
        run: flutter analyze

      - name: Build release APK
        working-directory: /tmp/ay_legend_client
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: /tmp/ay_legend_client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
